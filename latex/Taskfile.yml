# =============================================================================
# Taskfile.yml — Shared Build Rules for BCP Education Books
# =============================================================================
# Included from each book's Taskfile.yml:
#
#   includes:
#     book:
#       taskfile: ../../common/latex/Taskfile.yml   # 2 ups: books/<name> -> repo root -> common
#       flatten: true
#       vars:
#         MAIN: main            # root .tex filename (no extension) [default: main]
#         TEXENGINE: xelatex    # xelatex or lualatex [default: xelatex]
#         OUT_DIR: out          # [default: out]
#
# No dir: is set on the include, so these tasks run in the including book's own
# directory (Task's documented default for includes) - equivalent to Make's
# CURDIR-relative `include`.
#
# Tasks exposed (flattened, so callable as `task digital` etc. from the book dir):
#   task / task digital   — build digital PDF (color)
#   task print            — build print PDF (grayscale-safe)
#   task cover            — build all cover artifacts (digital + print + thumbnail)
#   task cover-digital    — build front-cover-only PDF (no bleed)
#   task cover-print      — build back+spine+front wraparound PDF (with bleed)
#   task cover-thumbnail  — rasterize the digital cover to a PNG (300dpi)
#   task clean            — remove auxiliary files
#   task distclean        — remove all build artifacts including PDFs
#   task watch            — live-rebuild on file changes (requires latexmk -pvc)
#   task lint             — run lacheck (if available)
#
# Cover tasks expect a book's cover/cover.tex (\documentclass{bcpedu-cover}),
# see common/latex/bcpedu-cover.cls. Override COVER_DIR/COVER_MAIN vars if a
# book uses a different location.
# =============================================================================

version: "3"

vars:
  MAIN: '{{.MAIN | default "main"}}'
  TEXENGINE: '{{.TEXENGINE | default "xelatex"}}'
  OUT_DIR: '{{.OUT_DIR | default "out"}}'
  EXTRA_TEXINPUTS: '{{.EXTRA_TEXINPUTS | default ""}}'
  # Absolute path of this Taskfile's own directory (common/latex), regardless
  # of which book includes it.
  COMMON_DIR: "{{.TASKFILE_DIR}}"
  # No dir: override on the include means these tasks run in the book's own
  # directory (Task's documented default) - $PWD at runtime is the book dir.
  TEXINPUTS_FULL: >-
    {{if .EXTRA_TEXINPUTS}}{{.EXTRA_TEXINPUTS}}:{{end}}{{.COMMON_DIR}}:$PWD:
  DIGITAL_PDF: "{{.OUT_DIR}}/{{.MAIN}}-digital.pdf"
  PRINT_PDF: "{{.OUT_DIR}}/{{.MAIN}}-print.pdf"
  COVER_DIR: '{{.COVER_DIR | default "cover"}}'
  COVER_MAIN: '{{.COVER_MAIN | default "cover"}}'
  COVER_DIGITAL_PDF: "{{.OUT_DIR}}/cover-digital.pdf"
  COVER_PRINT_PDF: "{{.OUT_DIR}}/cover-print.pdf"
  COVER_THUMBNAIL_PNG: "{{.OUT_DIR}}/cover-thumbnail.png"

tasks:
  default:
    desc: Build the digital (color) PDF
    cmds:
      - task: digital

  digital:
    desc: Build the digital (color) PDF
    deps: [_ensure_outdir, _copy_ist]
    cmds:
      - 'echo "==> Building digital PDF: {{.DIGITAL_PDF}}"'
      - >-
        TEXINPUTS="{{.TEXINPUTS_FULL}}"
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode
        -file-line-error -r {{.COMMON_DIR}}/latexmkrc
        -jobname={{.MAIN}}-digital
        -pretex="\PassOptionsToClass{digital}{bcpedu}" -usepretex
        {{.MAIN}}.tex
      - mv -f "{{.MAIN}}-digital.pdf" "{{.DIGITAL_PDF}}"
      - 'echo "==> Done: {{.DIGITAL_PDF}}"'

  print:
    desc: Build the print (grayscale-safe) PDF
    deps: [_ensure_outdir, _copy_ist]
    cmds:
      - 'echo "==> Building print PDF: {{.PRINT_PDF}}"'
      - >-
        TEXINPUTS="{{.TEXINPUTS_FULL}}"
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode
        -file-line-error -r {{.COMMON_DIR}}/latexmkrc
        -jobname={{.MAIN}}-print
        -pretex="\PassOptionsToClass{print}{bcpedu}" -usepretex
        {{.MAIN}}.tex
      - mv -f "{{.MAIN}}-print.pdf" "{{.PRINT_PDF}}"
      - 'echo "==> Done: {{.PRINT_PDF}}"'

  cover:
    desc: Build all cover artifacts (digital front, print wraparound, thumbnail)
    cmds:
      - task: cover-digital
      - task: cover-print
      - task: cover-thumbnail

  cover-digital:
    desc: Build the front-cover-only PDF (trim size, no bleed) - digital/thumbnail use
    deps: [_ensure_outdir]
    cmds:
      - 'echo "==> Building digital cover PDF: {{.COVER_DIGITAL_PDF}}"'
      - >-
        TEXINPUTS="{{.TEXINPUTS_FULL}}"
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode
        -file-line-error -cd- -r {{.COMMON_DIR}}/latexmkrc
        -jobname={{.COVER_MAIN}}-digital
        -pretex="\PassOptionsToClass{front}{bcpedu-cover}" -usepretex
        {{.COVER_DIR}}/{{.COVER_MAIN}}.tex
      - mv -f "{{.COVER_MAIN}}-digital.pdf" "{{.COVER_DIGITAL_PDF}}"
      - 'echo "==> Done: {{.COVER_DIGITAL_PDF}}"'

  cover-print:
    desc: Build the full wraparound (back+spine+front, with bleed) print-ready cover PDF
    deps: [_ensure_outdir, print]
    cmds:
      - |
        echo "==> Computing spine width from print PDF page count"
        PAGES=$(pdfinfo "{{.PRINT_PDF}}" | awk '/^Pages:/ {print $2}')
        if [ -z "$PAGES" ]; then
          echo "ERROR: could not determine page count from {{.PRINT_PDF}}" >&2
          exit 1
        fi
        # Approximate KDP-style spine formula for white paper (~0.0025in/page), floor 0.06in.
        SPINE_IN=$(awk -v p="$PAGES" 'BEGIN { s = p * 0.0025; if (s < 0.06) s = 0.06; printf "%.3f", s }')
        echo "==> Pages: $PAGES, computed spine width: ${SPINE_IN}in"
        echo "==> Building print cover PDF: {{.COVER_PRINT_PDF}}"
        TEXINPUTS="{{.TEXINPUTS_FULL}}" \
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode \
          -file-line-error -cd- -r {{.COMMON_DIR}}/latexmkrc \
          -jobname={{.COVER_MAIN}}-print \
          -pretex="\newcommand{\bcpinjectedspinewidth}{${SPINE_IN}in}\PassOptionsToClass{wrap}{bcpedu-cover}" -usepretex \
          {{.COVER_DIR}}/{{.COVER_MAIN}}.tex
        mv -f "{{.COVER_MAIN}}-print.pdf" "{{.COVER_PRINT_PDF}}"
        echo "==> Done: {{.COVER_PRINT_PDF}}"

  cover-thumbnail:
    desc: Rasterize the digital front cover to a PNG thumbnail (300dpi)
    deps: [cover-digital]
    cmds:
      - |
        if command -v pdftoppm >/dev/null 2>&1; then
          pdftoppm -r 300 -png -singlefile "{{.COVER_DIGITAL_PDF}}" "{{.OUT_DIR}}/cover-thumbnail"
        elif command -v magick >/dev/null 2>&1; then
          magick -density 300 "{{.COVER_DIGITAL_PDF}}" "{{.COVER_THUMBNAIL_PNG}}"
        else
          echo "ERROR: need pdftoppm (poppler-utils) or ImageMagick 'magick' to build the thumbnail" >&2
          exit 1
        fi
        echo "==> Done: {{.COVER_THUMBNAIL_PNG}}"

  watch:
    desc: Live-rebuild the digital PDF on file changes (Ctrl-C to stop)
    deps: [_ensure_outdir, _copy_ist]
    cmds:
      - echo "==> Watching for changes (digital mode). Press Ctrl-C to stop."
      - echo "==> PDF will be at ./{{.MAIN}}-digital.pdf (book root) while watching"
      - >-
        TEXINPUTS="{{.TEXINPUTS_FULL}}"
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode
        -file-line-error -r {{.COMMON_DIR}}/latexmkrc
        -pvc -jobname={{.MAIN}}-digital
        -pretex="\PassOptionsToClass{digital}{bcpedu}" -usepretex
        {{.MAIN}}.tex

  lint:
    desc: Static analysis with lacheck (optional, may not be installed)
    cmds:
      - |
        if command -v lacheck >/dev/null 2>&1; then
          python3 "{{.COMMON_DIR}}/lacheck-wrapper.py" "{{.MAIN}}.tex"
        else
          echo "lacheck not found — skipping lint"
        fi

  clean:
    desc: Remove all build artifacts (out/ + any stray root-level files)
    cmds:
      - echo "==> Cleaning auxiliary files"
      - >-
        TEXINPUTS="{{.TEXINPUTS_FULL}}"
        latexmk -{{.TEXENGINE}} -shell-escape -interaction=nonstopmode
        -file-line-error -r {{.COMMON_DIR}}/latexmkrc
        -c {{.MAIN}}.tex || true
      - rm -rf "{{.OUT_DIR}}" _minted/
      - >-
        rm -f *.aux *.log *.out *.toc *.lof *.lot *.lol
        *.bbl *.bcf *.blg *.run.xml *.bcf-SAVE-ERROR *.bbl-SAVE-ERROR
        *.idx *.ilg *.ind *.ist
        *.glo *.gls *.glg *.acn *.acr *.alg
        *.fls *.fdb_latexmk *.synctex.gz *.synctex\(busy\)
        *.listing *.minted *.xdv *.pdf
        2>/dev/null || true
      - rm -rf svg-inkscape/
      - echo "==> Clean done"

  distclean:
    desc: Alias for clean (out/ holds everything, including PDFs)
    cmds:
      - task: clean
      - echo "==> Distclean done"

  _ensure_outdir:
    internal: true
    cmds:
      - mkdir -p "{{.OUT_DIR}}"

  _copy_ist:
    internal: true
    status:
      - test -f bcpedu-index.ist
    cmds:
      - cp "{{.COMMON_DIR}}/bcpedu-index.ist" ./bcpedu-index.ist
